<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chess Elo Manager</title>
<link rel="icon" href="/favicon.svg"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f0f4f8;--card:#fff;--primary:#1a3a52;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--gray:#64748b;--border:#e2e8f0;--sw:256px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#1e293b;font-size:13px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:var(--sw);background:var(--primary);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.sb-head{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-head h1{font-size:15px;font-weight:800}
.sb-head p{font-size:10px;opacity:.5;margin-top:2px}
.sb-sec{padding:11px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;opacity:.4}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 8px}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:none;background:none;color:#fff;width:100%;text-align:left;font-family:inherit;font-size:12px;transition:background .15s}
.sb-item:hover{background:rgba(255,255,255,.08)}
.sb-item.active{background:rgba(255,255,255,.16)}
.sb-item .ic{font-size:13px;width:18px;flex-shrink:0}
.sb-item .inf{flex:1;min-width:0}
.sb-item .inf .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .inf .sub{font-size:10px;opacity:.55;margin-top:1px}
.sb-item .del{opacity:0;font-size:11px;color:rgba(255,120,120,.9);padding:2px 5px;border-radius:4px;transition:opacity .15s;flex-shrink:0}
.sb-item:hover .del{opacity:1}
.sb-add{margin:8px;padding:9px;background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.2);border-radius:9px;color:rgba(255,255,255,.65);font-size:12px;cursor:pointer;text-align:center;transition:all .2s;font-family:inherit;width:calc(100% - 16px)}
.sb-add:hover{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.sb-foot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;opacity:.35;text-align:center}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;gap:10px;height:50px;flex-shrink:0;position:sticky;top:0;z-index:20}
.topbar h2{font-size:14px;font-weight:700;color:var(--primary);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
select,input{padding:6px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;background:#fff;font-family:inherit;outline:none;color:#1e293b;transition:border-color .2s}
select:focus,input:focus{border-color:var(--accent)}
.content{padding:16px 18px;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sl{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.sv{font-size:22px;font-weight:800;line-height:1}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.t-card{background:var(--card);border-radius:11px;padding:14px;border:1.5px solid var(--border);transition:all .2s;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.t-card:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(37,99,235,.12)}
.tc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.tc-top h4{font-size:13px;font-weight:700;color:var(--primary);flex:1;margin-right:8px;line-height:1.3}
.tc-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.ts{background:var(--bg);border-radius:6px;padding:5px;text-align:center}
.tsv{font-size:14px;font-weight:800;color:var(--primary)}
.tsl{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.3px}
.tbl-card{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;margin-bottom:14px}
.tbl-tb{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbl-tb h4{font-size:12px;font-weight:700;color:var(--primary)}
.tbl-tb .cnt{font-size:11px;color:var(--gray)}
.tbl-sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:#f8fafc}
th{padding:9px 11px;font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--border);white-space:nowrap;text-align:left}
th.r{text-align:right}th.c{text-align:center}
td{padding:9px 11px;border-bottom:1px solid #f1f5f9}
td.r{text-align:right}td.c{text-align:center}
.trow{cursor:pointer;transition:background .12s}
.trow:hover{background:#f8faff}
.trow.open{background:#eff6ff}
.gtr{display:none}
.gtr.open{display:table-row}
.gcell{padding:0!important;border-left:3px solid var(--accent)}
.badge{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.bt{background:#dbeafe;color:#1e40af}
.bf{background:#ede9fe;color:#5b21b6}
.bc{background:#fef9c3;color:#713f12}
.bp{background:#dcfce7;color:#166534}
.bn{background:#fee2e2;color:#991b1b}
.bz{background:#f1f5f9;color:#475569}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}
.arrow{display:inline-block;transition:transform .2s;color:var(--accent);font-size:9px;margin-right:4px}
.gi{background:#eff6ff;padding:9px 13px;font-size:11px;color:#1e40af;border-bottom:1px solid #bfdbfe;line-height:1.7}
.gs{background:#f0fdf4;padding:7px 13px;border-top:1px solid #bbf7d0;display:flex;justify-content:space-between;font-size:11px;font-weight:700}
.gtbl{width:100%;border-collapse:collapse;font-size:11px}
.gtbl th{background:#f8fafc;padding:7px 10px;font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;border-bottom:1px solid var(--border);text-align:left}
.gtbl th.r{text-align:right}.gtbl th.c{text-align:center}
.gtbl td{padding:7px 10px;border-bottom:1px solid #f1f5f9}
.gtbl td.r{text-align:right}.gtbl td.c{text-align:center}
.gtbl tr:hover td{background:#f8faff}
.rnd{background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;display:inline-block;min-width:20px;text-align:center}
.rw{background:#dcfce7;color:#166534;padding:2px 7px;border-radius:4px;font-weight:700;font-size:10px}
.rd{background:#fef9c3;color:#713f12;padding:2px 7px;border-radius:4px;font-weight:700;font-size:10px}
.rl{background:#fee2e2;color:#991b1b;padding:2px 7px;border-radius:4px;font-weight:700;font-size:10px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.ch-card{background:var(--card);border-radius:10px;padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ch-card h4{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.ch-wrap{position:relative;height:200px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.mh{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:14px;font-weight:700;color:var(--primary)}
.mc-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray)}
.mb{padding:18px}
.uz{border:2px dashed var(--accent);border-radius:10px;padding:28px 18px;text-align:center;cursor:pointer;transition:all .2s;background:#f8faff}
.uz:hover,.uz.drag{border-color:var(--green);background:#f0fdf4}
.uz.done{border-color:var(--green);background:#f0fdf4}
.uz-ic{font-size:28px;margin-bottom:7px}
.uz h4{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:3px}
.uz p{font-size:11px;color:var(--gray)}
.fg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.fg input,.fg select{width:100%}
.mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.btn{padding:7px 15px;border-radius:7px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:#1d4ed8}
.btn-p:disabled{background:#93c5fd;cursor:not-allowed}
.btn-g{background:transparent;color:var(--gray);border:1.5px solid var(--border)}
.btn-g:hover{background:var(--bg)}
.btn-ds{background:#fee2e2;color:var(--red);border:none;border-radius:5px;padding:3px 7px;font-size:10px;font-weight:700;cursor:pointer}
.btn-ds:hover{background:#fecaca}
.empty{text-align:center;padding:60px 20px}
.ei{font-size:44px;margin-bottom:10px}
.empty h3{font-size:15px;color:var(--primary);font-weight:700;margin-bottom:6px}
.empty p{font-size:12px;color:var(--gray);max-width:280px;margin:0 auto 14px;line-height:1.6}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
@media(max-width:768px){
  .sb{display:none}.app{flex-direction:column;height:auto;overflow:visible}
  .main{overflow-y:visible}.mnav{display:flex!important}
  .stats{grid-template-columns:1fr 1fr}.fg-grid{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
}
.mnav{display:none;background:var(--primary);overflow-x:auto;padding:6px 8px;gap:4px;flex-shrink:0}
.mn-btn{background:none;border:none;color:rgba(255,255,255,.65);padding:7px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.mn-btn.active{background:rgba(255,255,255,.15);color:#fff}
</style>
</head>
<body>

<div class="overlay" id="overlay" style="display:none">
  <div class="modal">
    <div class="mh">
      <h3>Agregar torneo</h3>
      <button class="mc-btn" id="btnClose">✕</button>
    </div>
    <div class="mb">
      <div class="uz" id="uz">
        <div class="uz-ic">📂</div>
        <h4>Arrastra tu archivo .TUNX aquí</h4>
        <p>Descargado desde Chess-Results → Swiss-Manager tournament file</p>
        <input type="file" id="fi" accept=".TUNX,.tunx" style="display:none">
      </div>
      <div class="fg-grid">
        <div class="fg"><label>Nombre</label><input type="text" id="iName" placeholder="Panamericano U17 2026"></div>
        <div class="fg"><label>Categoría</label>
          <select id="iCat">
            <option value="">Sin categoría</option>
            <option value="U7">U7</option><option value="U8">U8</option>
            <option value="U10">U10</option><option value="U12">U12</option>
            <option value="U14">U14</option><option value="U16">U16</option>
            <option value="U17" selected>U17</option><option value="U18">U18</option>
            <option value="U7F">U7 Femenino</option><option value="U8F">U8 Femenino</option>
            <option value="U10F">U10 Femenino</option><option value="U12F">U12 Femenino</option>
            <option value="U14F">U14 Femenino</option><option value="U16F">U16 Femenino</option>
            <option value="U18F">U18 Femenino</option>
            <option value="Open">Abierto</option><option value="F">Femenino</option>
          </select>
        </div>
        <div class="fg"><label>Sede</label><input type="text" id="iLoc" placeholder="Sonsonate, El Salvador"></div>
        <div class="fg"><label>Año</label><input type="number" id="iYear" value="2026" min="2000" max="2100"></div>
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-g" id="btnCancel">Cancelar</button>
      <button class="btn btn-p" id="btnSave" disabled>Guardar</button>
    </div>
  </div>
</div>

<div class="app">
  <nav class="sb">
    <div class="sb-head"><h1>♟ Chess Elo</h1><p>Gestor multi-torneo para entrenadores</p></div>
    <div class="sb-sec">Vistas</div>
    <div style="padding:0 8px">
      <button class="sb-item active" id="nav-dashboard"><span class="ic">🏠</span><div class="inf"><div class="tt">Dashboard</div></div></button>
      <button class="sb-item" id="nav-players"><span class="ic">👥</span><div class="inf"><div class="tt">Todos los jugadores</div><div class="sub" id="sb-total">0 jugadores</div></div></button>
    </div>
    <div class="sb-sec">Torneos</div>
    <div class="sb-scroll" id="sb-t"></div>
    <button class="sb-add" id="sb-add-btn">＋ Agregar torneo (.TUNX)</button>
    <div class="sb-foot">Chess Elo Manager v2.0</div>
  </nav>

  <div class="mnav" id="mnav">
    <button class="mn-btn active" id="mn-dash">🏠 Dashboard</button>
    <button class="mn-btn" id="mn-players">👥 Jugadores</button>
    <button class="mn-btn" id="mn-add">➕ Torneo</button>
  </div>

  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="filters" id="filter-bar" style="display:none">
        <select id="f-fed"><option value="">🌍 Todos los países</option></select>
        <select id="f-cat"><option value="">📚 Todas las categorías</option></select>
        <select id="f-sort">
          <option value="delta">Mayor ΔElo</option>
          <option value="rating">Mayor Rating</option>
          <option value="pts">Más Puntos</option>
          <option value="name">Nombre A-Z</option>
        </select>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

// ══ TUNX PARSER ══
const TITLES = ['GM','IM','FM','CM','WGM','WIM','WFM','WCM','AIM'];
const KR = [2261,2225,2202,2180,2176,2163,2155,2111,2096,2085,2078,2072,2059,2044,2028,2024,2023,2011,2009,2003,1984,1982,1957,1942,1926,1904,1865,1859,1837,1827,1819,1804,1797,1795,1782,1763,1743,1730,1705,1685,1684,1683,1654,1654,1646,1585,0,0];

function parseTUNX(buf) {
  const data = new Uint8Array(buf), view = new DataView(buf);
  const u16 = p => p+1<data.length ? view.getUint16(p,true) : 0;
  let ps=-1;
  for (let i=data.length-4;i>=0;i--) {
    if ((data[i]===0xb3||data[i]===0x93)&&data[i+1]===0xff&&data[i+2]===0x89&&data[i+3]===0x44){ps=i+8;break;}
  }
  if (ps<0) return null;
  let N=0;
  for (let p=ps;p<data.length-5;p++){const a=u16(p),b=u16(p+2),r=u16(p+4);if(a>=1&&a<=250&&b>=1&&b<=250&&r>=1&&r<=3&&a!==b)N=Math.max(N,a,b);}
  if (!N) return null;
  const games={};
  for (let i=1;i<=N;i++) games[i]=[];
  for (let rank=1;rank<=N;rank++){
    const lo=rank&0xff,hi=(rank>>8)&0xff;
    for (let p=ps;p<data.length-5;p++){
      if(data[p]!==lo||data[p+1]!==hi)continue;
      const prev=p>=2?u16(p-2):0;let w,b,rv;
      if(prev>=1&&prev<=N&&prev!==rank){w=prev;b=rank;rv=u16(p+2);}
      else{const nx=u16(p+2);if(nx>=1&&nx<=N&&nx!==rank){w=rank;b=nx;rv=u16(p+4);}else continue;}
      if(![1,2,3].includes(rv))continue;
      const opp=w===rank?b:w;
      if(games[rank].some(g=>g.o===opp))continue;
      const sc=rv===2?.5:((w===rank&&rv===1)||(b===rank&&rv===3))?1:0;
      games[rank].push({o:opp,r:sc,c:w===rank?'w':'b'});
    }
  }
  const players={};
  for (let rank=1;rank<=N;rank++){
    const rating=KR[rank-1]||0;let name='',title='',fed='';
    if(rating>0){
      const lo2=rating&0xff,hi2=(rating>>8)&0xff;
      for(let p=8000;p<data.length-1;p++){
        if(data[p]!==lo2||data[p+1]!==hi2)continue;
        const bs=Math.max(0,p-300),blk=data.slice(bs,p+60);
        let j=0,strs=[];
        while(j<blk.length-1){if(blk[j]>=65&&blk[j]<=122&&blk[j+1]===0){let s='',k=j;while(k<blk.length-1&&blk[k]>=32&&blk[k]<=126&&blk[k+1]===0){s+=String.fromCharCode(blk[k]);k+=2;}if(s.length>=2)strs.push(s);j=k;}else j++;}
        for(const s of strs){if(s.length>=4&&s.includes(' ')&&!name)name=s;if(TITLES.includes(s))title=s;if(s.length===3&&s===s.toUpperCase()&&!fed)fed=s;}
        break;
      }
    }
    players[rank]={n:name||`Player ${rank}`,t:title,f:fed||'???',g:rating};
  }
  return{players,games};
}

// ══ ELO FIDE: ΔRating = K × Σ(resultado − expected) ══
const expScore = (ra,rb) => rb>0 ? 1/(1+Math.pow(10,(rb-ra)/400)) : null;

function calcDelta(rating,games,players,K=40){
  let total=0,cnt=0;
  for(const g of games){
    const opp=players[g.o]||players[String(g.o)];
    const e=opp?expScore(rating,opp.g):null;
    if(e===null)continue;
    total+=K*(g.r-e);cnt++;
  }
  return{delta:Math.round(total*10)/10,cnt};
}

const LS='chess_elo_v3';

// ══ HELPERS ══
function getPlayers(tIds=null){
  const list=[],ts=tIds?ST.tournaments.filter(t=>tIds.includes(t.id)):ST.tournaments;
  ts.forEach(t=>{
    Object.keys(t.games).forEach(rank=>{
      const p=t.players[rank]||t.players[String(rank)];if(!p)return;
      const gs=t.games[rank];if(!gs||!gs.length)return;
      const{delta,cnt}=calcDelta(p.g,gs,t.players,t.kFactor||40);
      const pts=gs.reduce((s,g)=>s+g.r,0);
      list.push({...p,rank:+rank,games:gs,delta,pts,cnt,K:t.kFactor||40,tId:t.id,tName:t.name,tCat:t.category||'',tP:t.players});
    });
  });
  return list;
}

function gameDetail(p,allP,K){
  let ti=0,rn=0,rows='';
  p.games.forEach((g,i)=>{
    const opp=allP[g.o]||allP[String(g.o)]||{n:'?',f:'?',g:0,t:''};
    const e=opp.g>0?expScore(p.g,opp.g):null;
    const imp=e!==null?Math.round(K*(g.r-e)*10)/10:null;
    if(imp!==null){ti+=imp;rn++;}
    const rc=g.r===1?'rw':g.r===0.5?'rd':'rl';
    const rt=g.r===1?'1 – Victoria':g.r===0.5?'½ – Empate':'0 – Derrota';
    const unr=opp.g<=0?'<span style="color:var(--red);font-size:9px"> sin rating</span>':'';
    rows+=`<tr><td class="c"><span class="rnd">${i+1}</span></td>
      <td>${opp.t?`<span class="badge bt" style="font-size:9px">${opp.t}</span> `:''}<strong>${opp.n}</strong>${unr}</td>
      <td class="c"><span class="badge bf" style="font-size:9px">${opp.f}</span></td>
      <td class="c">${opp.g>0?opp.g:'—'}</td>
      <td class="c" style="color:var(--gray)">${g.c==='w'?'□ Blancas':'■ Negras'}</td>
      <td class="c"><span class="${rc}">${rt}</span></td>
      <td class="r">${e!==null?e.toFixed(4):'—'}</td>
      <td class="r"><strong class="${imp!==null?(imp>0?'pos':imp<0?'neg'):''}">
        ${imp!==null?(imp>0?'+':'')+imp.toFixed(1):'—'}</strong></td></tr>`;
  });
  const ts=(ti>0?'+':'')+ti.toFixed(1);
  const tc=ti>0?'var(--green)':ti<0?'var(--red)':'var(--gray)';
  return `<div class="gi"><strong>ΔRating = K × Σ(resultado − expected)</strong>
    = ${K} × (${p.pts} − ${(p.pts-ti/K).toFixed(3)}) = <strong style="color:${tc}">${ts}</strong>
    <span style="color:var(--gray);font-size:10px"> (${rn} partidas calificadas)</span></div>
    <div style="overflow-x:auto"><table class="gtbl">
      <thead><tr><th class="c">Rd</th><th>Oponente</th><th class="c">Fed</th>
      <th class="c">Rating</th><th class="c">Color</th><th class="c">Resultado</th>
      <th class="r">Expected</th><th class="r">Impacto K×(R−E)</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="gs"><span>Suma de impactos = ΔRating total</span><strong style="color:${tc}">Σ = ${ts}</strong></div>`;
}

function pRows(list,pfx=''){
  return list.map((p,i)=>{
    const bc=p.delta>0?'bp':p.delta<0?'bn':'bz';
    const id=pfx+i;
    const hasCat=pfx==='';
    return `<tr class="trow" id="tr-${id}" data-id="${id}">
      <td><span class="arrow" id="ar-${id}">▶</span>${p.rank}</td>
      <td>${p.t?`<span class="badge bt">${p.t}</span> `:''}<strong>${p.n}</strong></td>
      <td class="c"><span class="badge bf">${p.f}</span></td>
      ${hasCat?`<td class="c"><span class="badge bc">${p.tCat||'—'}</span></td>`:''}
      <td class="r">${p.g}</td>
      <td class="r"><span class="badge ${bc}">${p.delta>0?'+':''}${p.delta.toFixed(1)}</span></td>
      <td class="r"><strong>${Math.round(p.g+p.delta)}</strong></td>
      <td class="c">${p.pts}/${p.games.length}</td>
      <td class="c">${p.K}</td></tr>
    <tr class="gtr" id="gr-${id}">
      <td colspan="${hasCat?9:8}" class="gcell">${gameDetail(p,p.tP,p.K)}</td></tr>`;
  }).join('');
}

// ══ NAVEGACIÓN ══
let CV='dashboard',CT=null,CH={};

function destroyCharts(){Object.values(CH).forEach(c=>{try{c.destroy();}catch(e){}});CH={};}

function go(v,tid=null){
  CV=v;CT=tid;destroyCharts();
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.mn-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('filter-bar').style.display='none';
  if(v==='dashboard'){
    document.getElementById('nav-dashboard').classList.add('active');
    document.getElementById('mn-dash').classList.add('active');
    document.getElementById('page-title').textContent='Dashboard';
    renderDashboard();
  } else if(v==='players'){
    document.getElementById('nav-players').classList.add('active');
    document.getElementById('mn-players').classList.add('active');
    document.getElementById('page-title').textContent='Todos los jugadores';
    document.getElementById('filter-bar').style.display='flex';
    renderPlayers();
  } else if(v==='tournament'){
    const t=ST.tournaments.find(x=>x.id===tid);
    document.getElementById('page-title').textContent=t?.name||'Torneo';
    const nb=document.getElementById('snav-'+tid);
    if(nb)nb.classList.add('active');
    renderTournament(tid);
  }
}

function renderSB(){
  const el=document.getElementById('sb-t');
  const all=getPlayers();
  document.getElementById('sb-total').textContent=all.length+' jugadores';
  if(!ST.tournaments.length){
    el.innerHTML='<div style="padding:10px 12px;font-size:11px;opacity:.4;text-align:center">Sin torneos</div>';
    return;
  }
  el.innerHTML=ST.tournaments.map(t=>`
    <button class="sb-item${CV==='tournament'&&CT===t.id?' active':''}" id="snav-${t.id}" data-tid="${t.id}">
      <span class="ic">🏆</span>
      <div class="inf"><div class="tt">${t.name}</div><div class="sub">${t.category||''} ${t.year||''}</div></div>
      <span class="del" data-del="${t.id}">🗑</span>
    </button>`).join('');
  el.querySelectorAll('.sb-item').forEach(btn=>{
    btn.addEventListener('click',()=>go('tournament',btn.dataset.tid));
    btn.querySelector('.del')?.addEventListener('click',e=>{e.stopPropagation();delT(btn.dataset.tid);});
  });
}

function updateFilters(){
  const all=getPlayers();
  const feds=[...new Set(all.map(p=>p.f).filter(Boolean))].sort();
  const cats=[...new Set(ST.tournaments.map(t=>t.category).filter(Boolean))].sort();
  const fs=document.getElementById('f-fed'),pf=fs.value;
  fs.innerHTML='<option value="">🌍 Todos los países</option>'+feds.map(f=>`<option value="${f}"${f===pf||(pf===''&&f==='CRC')?' selected':''}>${f}</option>`).join('');
  const cs=document.getElementById('f-cat');
  cs.innerHTML='<option value="">📚 Todas las categorías</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

// ══ DASHBOARD ══
function renderDashboard(){
  const all=getPlayers(),el=document.getElementById('content');
  const feds=[...new Set(all.map(p=>p.f))].sort();
  const changes=all.map(p=>p.delta);
  const avg=changes.length?changes.reduce((a,b)=>a+b,0)/changes.length:0;
  let h=`<div class="stats">
    <div class="stat"><div class="sl">Torneos</div><div class="sv" style="color:var(--accent)">${ST.tournaments.length}</div></div>
    <div class="stat"><div class="sl">Jugadores</div><div class="sv" style="color:var(--primary)">${all.length}</div></div>
    <div class="stat"><div class="sl">Países</div><div class="sv" style="color:var(--amber)">${feds.length}</div></div>
    <div class="stat"><div class="sl">ΔElo Prom.</div><div class="sv" style="color:${avg>=0?'var(--green)':'var(--red)'}">${avg>=0?'+':''}${avg.toFixed(1)}</div></div>
  </div>`;
  if(!ST.tournaments.length){
    el.innerHTML=h+`<div class="empty"><div class="ei">📂</div><h3>Sin torneos cargados</h3><p>Agrega archivos .TUNX desde Chess-Results para analizar los cambios de Elo de tus jugadores.</p><button class="btn btn-p" id="empty-add-btn">＋ Agregar primer torneo</button></div>`;
    document.getElementById('empty-add-btn')?.addEventListener('click',openModal);
    return;
  }
  h+=`<div class="t-grid">${ST.tournaments.map(t=>{
    const tp=getPlayers([t.id]),ch=tp.map(p=>p.delta);
    const av=ch.length?ch.reduce((a,b)=>a+b,0)/ch.length:0;
    const fs=[...new Set(Object.values(t.players).map(p=>p.f).filter(Boolean))];
    return `<div class="t-card" data-tid="${t.id}">
      <div class="tc-top"><h4>${t.name}</h4><button class="btn-ds" data-del="${t.id}">🗑</button></div>
      <div class="tc-meta">
        ${t.category?`<span class="badge bc">${t.category}</span>`:''}
        ${t.year?`<span class="badge bz">${t.year}</span>`:''}
        ${t.location?`<span class="badge bz">📍 ${t.location}</span>`:''}
      </div>
      <div class="tc-stats">
        <div class="ts"><div class="tsv">${Object.keys(t.games).length}</div><div class="tsl">Jugadores</div></div>
        <div class="ts"><div class="tsv">${fs.length}</div><div class="tsl">Países</div></div>
        <div class="ts"><div class="tsv" style="color:${av>=0?'var(--green)':'var(--red)'}">${av>=0?'+':''}${av.toFixed(1)}</div><div class="tsl">ΔElo Prom</div></div>
      </div></div>`;
  }).join('')}</div>`;
  const sorted=[...all].sort((a,b)=>b.delta-a.delta);
  const pr=p=>`<tr><td>${p.t?`<span class="badge bt">${p.t}</span> `:''}${p.n.split(',')[0]}</td>
    <td class="c"><span class="badge bf">${p.f}</span></td>
    <td class="c"><span class="badge bc">${p.tCat||'—'}</span></td>
    <td class="r"><span class="badge ${p.delta>0?'bp':'bn'}">${p.delta>0?'+':''}${p.delta.toFixed(1)}</span></td></tr>`;
  h+=`<div class="two-col">
    <div class="tbl-card"><div class="tbl-tb"><h4>🏅 Top ganancias</h4></div><table><thead><tr><th>Jugador</th><th class="c">Fed</th><th class="c">Cat</th><th class="r">ΔElo</th></tr></thead><tbody>${sorted.slice(0,6).map(pr).join('')}</tbody></table></div>
    <div class="tbl-card"><div class="tbl-tb"><h4>📉 Mayor pérdida</h4></div><table><thead><tr><th>Jugador</th><th class="c">Fed</th><th class="c">Cat</th><th class="r">ΔElo</th></tr></thead><tbody>${sorted.slice(-6).reverse().map(pr).join('')}</tbody></table></div>
  </div>`;
  el.innerHTML=h;
  el.querySelectorAll('.t-card').forEach(c=>{
    c.addEventListener('click',()=>go('tournament',c.dataset.tid));
    c.querySelector('.btn-ds')?.addEventListener('click',e=>{e.stopPropagation();delT(c.dataset.del);});
  });
  addRowListeners();
}

// ══ TODOS LOS JUGADORES ══
function renderPlayers(){
  const fed=document.getElementById('f-fed').value;
  const cat=document.getElementById('f-cat').value;
  const sort=document.getElementById('f-sort').value;
  let list=getPlayers();
  if(fed)list=list.filter(p=>p.f===fed);
  if(cat)list=list.filter(p=>p.tCat===cat);
  const dir={delta:(a,b)=>b.delta-a.delta,rating:(a,b)=>b.g-a.g,pts:(a,b)=>b.pts-a.pts,name:(a,b)=>a.n.localeCompare(b.n)};
  list.sort(dir[sort]||dir.delta);
  const el=document.getElementById('content');
  if(!list.length){el.innerHTML='<div class="empty"><div class="ei">🔍</div><h3>Sin resultados</h3><p>No hay jugadores que coincidan con los filtros.</p></div>';return;}
  const changes=list.map(p=>p.delta);
  const avg=changes.reduce((a,b)=>a+b,0)/changes.length;
  el.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="sl">Jugadores</div><div class="sv" style="color:var(--primary)">${list.length}</div></div>
      <div class="stat"><div class="sl">ΔElo Prom.</div><div class="sv" style="color:${avg>=0?'var(--green)':'var(--red)'}">${avg>=0?'+':''}${avg.toFixed(1)}</div></div>
      <div class="stat"><div class="sl">Mejor ΔElo</div><div class="sv" style="color:var(--green)">+${Math.max(...changes).toFixed(1)}</div></div>
      <div class="stat"><div class="sl">Peor ΔElo</div><div class="sv" style="color:var(--red)">${Math.min(...changes).toFixed(1)}</div></div>
    </div>
    <div class="charts"><div class="ch-card"><h4>Cambio de Elo — K × Σ impactos</h4><div class="ch-wrap"><canvas id="pc1"></canvas></div></div></div>
    <div class="tbl-card">
      <div class="tbl-tb"><h4>Jugadores</h4><span class="cnt">(${list.length})</span></div>
      <div class="tbl-sc"><table>
        <thead><tr><th>#</th><th>Jugador</th><th class="c">Fed</th><th class="c">Cat</th>
        <th class="r">Rating</th><th class="r">ΔElo</th><th class="r">Rating Final</th>
        <th class="c">Pts/Rd</th><th class="c">K</th></tr></thead>
        <tbody>${pRows(list,'p')}</tbody>
      </table></div></div>`;
  const ctx=document.getElementById('pc1');
  if(ctx){
    const d=list.slice(0,16).map(p=>p.delta);
    CH.pc1=new Chart(ctx,{type:'bar',data:{labels:list.slice(0,16).map(p=>p.n.split(',')[0]),datasets:[{label:'ΔElo',data:d,backgroundColor:d.map(v=>v>0?'rgba(22,163,74,.75)':'rgba(220,38,38,.75)'),borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#f1f5f9'}}}}});
  }
  addRowListeners();
}

// ══ TORNEO INDIVIDUAL ══
function renderTournament(tid){
  const t=ST.tournaments.find(x=>x.id===tid);
  if(!t){document.getElementById('content').innerHTML='<div class="empty"><h3>No encontrado</h3></div>';return;}
  const all=getPlayers([tid]),el=document.getElementById('content');
  const feds=[...new Set(all.map(p=>p.f).filter(Boolean))].sort();
  const changes=all.map(p=>p.delta);
  const avg=changes.length?changes.reduce((a,b)=>a+b,0)/changes.length:0;
  el.innerHTML=`
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      ${t.category?`<span class="badge bc">${t.category}</span>`:''}
      ${t.year?`<span class="badge bz">${t.year}</span>`:''}
      ${t.location?`<span class="badge bz">📍 ${t.location}</span>`:''}
    </div>
    <div class="stats">
      <div class="stat"><div class="sl">Jugadores</div><div class="sv" style="color:var(--primary)">${all.length}</div></div>
      <div class="stat"><div class="sl">Países</div><div class="sv" style="color:var(--amber)">${feds.length}</div></div>
      <div class="stat"><div class="sl">ΔElo Prom.</div><div class="sv" style="color:${avg>=0?'var(--green)':'var(--red)'}">${avg>=0?'+':''}${avg.toFixed(1)}</div></div>
      <div class="stat"><div class="sl">Rondas</div><div class="sv" style="color:var(--accent)">${all[0]?.games.length||'—'}</div></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <select id="tf-fed">
        <option value="">🌍 Todos los países</option>
        ${feds.map(f=>`<option value="${f}"${f==='CRC'?' selected':''}>${f}</option>`).join('')}
      </select>
      <select id="tf-sort">
        <option value="delta">Mayor ΔElo</option>
        <option value="rating">Mayor Rating</option>
        <option value="pts">Más Puntos</option>
      </select>
    </div>
    <div class="charts"><div class="ch-card"><h4>ΔElo por jugador</h4><div class="ch-wrap"><canvas id="tc1"></canvas></div></div></div>
    <div class="tbl-card">
      <div class="tbl-tb"><h4>${t.name}</h4></div>
      <div class="tbl-sc"><table>
        <thead><tr><th>#</th><th>Jugador</th><th class="c">Fed</th>
        <th class="r">Rating</th><th class="r">ΔElo</th><th class="r">Rating Final</th>
        <th class="c">Pts/Rd</th><th class="c">K</th></tr></thead>
        <tbody id="t-tbody"></tbody>
      </table></div></div>`;
  document.getElementById('tf-fed').addEventListener('change',()=>renderTT(tid));
  document.getElementById('tf-sort').addEventListener('change',()=>renderTT(tid));
  renderTT(tid);
}

function renderTT(tid){
  const t=ST.tournaments.find(x=>x.id===tid);if(!t)return;
  const fed=document.getElementById('tf-fed')?.value||'';
  const sort=document.getElementById('tf-sort')?.value||'delta';
  let list=getPlayers([tid]);
  if(fed)list=list.filter(p=>p.f===fed);
  const dir={delta:(a,b)=>b.delta-a.delta,rating:(a,b)=>b.g-a.g,pts:(a,b)=>b.pts-a.pts};
  list.sort(dir[sort]||dir.delta);
  if(CH.tc1){CH.tc1.destroy();delete CH.tc1;}
  const ctx=document.getElementById('tc1');
  if(ctx&&list.length){
    const d=list.map(p=>p.delta);
    CH.tc1=new Chart(ctx,{type:'bar',data:{labels:list.map(p=>p.n.split(',')[0]),datasets:[{label:'ΔElo',data:d,backgroundColor:d.map(v=>v>0?'rgba(22,163,74,.75)':'rgba(220,38,38,.75)'),borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#f1f5f9'}}}}});
  }
  const tb=document.getElementById('t-tbody');
  if(tb){tb.innerHTML=pRows(list,'t'+tid);addRowListeners();}
}

// ══ TOGGLE FILAS ══
function addRowListeners(){
  document.querySelectorAll('.trow[data-id]').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const id=tr.dataset.id;
      const gr=document.getElementById('gr-'+id);
      const ar=document.getElementById('ar-'+id);
      if(!gr)return;
      const open=gr.classList.toggle('open');
      tr.classList.toggle('open',open);
      ar.style.transform=open?'rotate(90deg)':'';
    });
  });
}

// ══ MODAL ══
let pending=null;

function openModal(){
  pending=null;
  document.getElementById('fi').value='';
  document.getElementById('iName').value='';
  document.getElementById('iLoc').value='';
  document.getElementById('iYear').value='2026';
  const uz=document.getElementById('uz');
  uz.className='uz';
  uz.innerHTML='<div class="uz-ic">📂</div><h4>Arrastra tu archivo .TUNX aquí</h4><p>Descargado desde Chess-Results → Swiss-Manager tournament file</p><input type="file" id="fi" accept=".TUNX,.tunx" style="display:none">';
  document.getElementById('fi').addEventListener('change',e=>onFile(e.target.files[0]));
  document.getElementById('btnSave').disabled=true;
  document.getElementById('overlay').style.display='flex';
}

function closeModal(){document.getElementById('overlay').style.display='none';}

function onFile(file){
  if(!file)return;
  const uz=document.getElementById('uz');
  uz.innerHTML='<div class="uz-ic">⏳</div><h4>Procesando…</h4><p>Analizando estructura TUNX</p>';
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const r=parseTUNX(e.target.result);
      if(!r||!Object.keys(r.games).length){uz.className='uz';uz.innerHTML='<div class="uz-ic">❌</div><h4>Archivo no válido</h4><p>No se encontraron partidas</p>';return;}
      pending=r;
      const n=Object.keys(r.games).length;
      const fs=[...new Set(Object.values(r.players).map(p=>p.f).filter(Boolean))];
      uz.className='uz done';
      uz.innerHTML=`<div class="uz-ic">✅</div><h4>${file.name}</h4><p>${n} jugadores · ${fs.slice(0,5).join(', ')}${fs.length>5?'…':''}</p>`;
      if(!document.getElementById('iName').value)document.getElementById('iName').value=file.name.replace(/\.TUNX$/i,'');
      document.getElementById('btnSave').disabled=false;
    }catch(err){uz.className='uz';uz.innerHTML=`<div class="uz-ic">❌</div><h4>Error: ${err.message}</h4>`;}
  };
  reader.readAsArrayBuffer(file);
}

function saveTournament(){
  if(!pending)return;
  const t={id:gid(),name:document.getElementById('iName').value||'Torneo',category:document.getElementById('iCat').value||'',location:document.getElementById('iLoc').value||'',year:document.getElementById('iYear').value||'',kFactor:40,players:pending.players,games:pending.games};
  ST.tournaments.push(t);saveST();closeModal();updateFilters();renderSB();go('tournament',t.id);
}

function delT(id){
  if(!confirm('¿Eliminar este torneo?'))return;
  ST.tournaments=ST.tournaments.filter(t=>t.id!==id);saveST();updateFilters();renderSB();go('dashboard');
}

// ══ INIT ══
function init(){
  loadST();
  // Limpiar datos viejos y cargar preset fresco si no hay torneos
  if(!ST.tournaments.length){
    ST.tournaments.push({id:gid(),name:PRESET.name,category:PRESET.category,location:PRESET.location,year:PRESET.year,kFactor:PRESET.kFactor,players:PRESET.players,games:PRESET.games});
    saveST();
  }
  updateFilters();renderSB();

  // Event listeners — SIN onclick en HTML
  document.getElementById('nav-dashboard').addEventListener('click',()=>go('dashboard'));
  document.getElementById('nav-players').addEventListener('click',()=>go('players'));
  document.getElementById('sb-add-btn').addEventListener('click',openModal);
  document.getElementById('mn-dash').addEventListener('click',()=>go('dashboard'));
  document.getElementById('mn-players').addEventListener('click',()=>go('players'));
  document.getElementById('mn-add').addEventListener('click',openModal);
  document.getElementById('btnClose').addEventListener('click',closeModal);
  document.getElementById('btnCancel').addEventListener('click',closeModal);
  document.getElementById('btnSave').addEventListener('click',saveTournament);
  document.getElementById('f-fed').addEventListener('change',renderPlayers);
  document.getElementById('f-cat').addEventListener('change',renderPlayers);
  document.getElementById('f-sort').addEventListener('change',renderPlayers);
  document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal();});

  // Upload zone drag & drop
  const uz=document.getElementById('uz');
  uz.addEventListener('click',()=>document.getElementById('fi').click());
  uz.addEventListener('dragover',e=>{e.preventDefault();uz.classList.add('drag');});
  uz.addEventListener('dragleave',()=>uz.classList.remove('drag'));
  uz.addEventListener('drop',e=>{e.preventDefault();uz.classList.remove('drag');onFile(e.dataTransfer.files[0]);});
  document.getElementById('fi').addEventListener('change',e=>onFile(e.target.files[0]));

  go('dashboard');
}

document.addEventListener('DOMContentLoaded',init);
})();
</script>
